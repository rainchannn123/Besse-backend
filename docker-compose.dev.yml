version: "3.8"

services:
  # ===========================================
  # BESSE Backend - Development
  # ===========================================
  besse-dev:
    build:
      context: .
      target: dev
    container_name: besse-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/besse-dev
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - besse-dev-network
    volumes:
      - .:/app
      - /app/node_modules
      - logs:/app/logs
    command: npm run dev

  # ===========================================
  # MongoDB - Development
  # ===========================================
  mongodb:
    image: mongo:6.0
    container_name: besse-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=dev
      - MONGO_INITDB_ROOT_PASSWORD=dev123
      - MONGO_INITDB_DATABASE=besse-dev
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - besse-dev-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================
  # Mongo Express (Database GUI)
  # ===========================================
  mongo-express:
    image: mongo-express:latest
    container_name: besse-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=dev
      - ME_CONFIG_MONGODB_ADMINPASSWORD=dev123
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - besse-dev-network

volumes:
  mongodb_dev_data:
  logs:

networks:
  besse-dev-network:
    driver: bridge
