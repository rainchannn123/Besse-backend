version: '3.8'

services:
  # ===========================================
  # BESSE Backend API
  # ===========================================
  besse-backend:
    build:
      context: .
      target: production
    container_name: besse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/besse-prod
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - besse-network
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # MongoDB Database
  # ===========================================
  mongodb:
    image: mongo:6.0
    container_name: besse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=changeme123
      - MONGO_INITDB_DATABASE=besse-prod
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - besse-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================
  # Redis (Optional - for caching)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: besse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - besse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ===========================================
  # Development Services
  # ===========================================
  besse-dev:
    build:
      context: .
      target: dev
    container_name: besse-dev
    restart: "no"
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - besse-network
    volumes:
      - .:/app
      - /app/node_modules
      - logs:/app/logs
    profiles:
      - dev

volumes:
  mongodb_data:
  redis_data:
  logs:

networks:
  besse-network:
    driver: bridge